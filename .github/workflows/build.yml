name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # Cheap feedback on every branch and pull request: no freezing, no Rust
  # release build. test_bootstrap skips itself when no library is present.
  test:
    name: Test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: python -B -m pip install -r requirements-dev.txt
      - name: Worker tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Pinned upstream contract tests
        env:
          PYTHONPATH: python/flow2api
        run: python -B -m unittest discover -s tests/upstream -p "test_*.py" -v
      - name: Rust plugin tests
        run: cargo test --locked

  # Full freeze, embed and clean-install verification. Only on release tags and
  # manual runs; Linux targets are intentionally not built.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, runner: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build and test dependencies
        run: python -B -m pip install -r requirements-dev.txt
      - name: Test, freeze Python, embed worker and verify clean plugin installation
        run: python -B .github/scripts/build.py --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/verification-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.goos }}-${{ matrix.goarch }}
          include-hidden-files: true
          path: |
            .build/**/worker.log
            .build/freezer/**/*.txt
          if-no-files-found: ignore

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist-download
          pattern: dist-*
          merge-multiple: true
      - name: Verify all platforms and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/publish.py
