<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run log - GFlow Login Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 540px;
      height: 480px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      color: #1e293b;
      background: #f8fafc;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 15px; color: #0d9488; }
    .actions { display: flex; gap: 6px; }
    button {
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-refresh { background: #0d9488; color: white; }
    .btn-refresh:hover { background: #0f766e; }
    .btn-clear { background: #ef4444; color: white; }
    .btn-clear:hover { background: #dc2626; }
    .btn-back { background: #64748b; color: white; }
    .btn-back:hover { background: #475569; }
    .logs-container {
      height: 400px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
    }
    .log-entry {
      padding: 6px 8px;
      margin-bottom: 6px;
      border-radius: 4px;
      border-left: 3px solid #cbd5e1;
      background: #f8fafc;
    }
    .log-entry.INFO { border-left-color: #0d9488; background: #f0fdfa; }
    .log-entry.SUCCESS { border-left-color: #10b981; background: #ecfdf5; }
    .log-entry.ERROR { border-left-color: #ef4444; background: #fef2f2; }
    .log-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .log-level {
      font-weight: 700;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 2px;
    }
    .log-level.INFO { background: #0d9488; color: white; }
    .log-level.SUCCESS { background: #10b981; color: white; }
    .log-level.ERROR { background: #ef4444; color: white; }
    .log-time { color: #64748b; font-size: 11px; }
    .log-message { color: #334155; }
    .log-details {
      background: rgba(0,0,0,0.03);
      padding: 4px 6px;
      margin-top: 4px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
      color: #475569;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
    }
    .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 GFlow run log</h1>
    <div class="actions">
      <button class="btn-refresh" id="refreshBtn">🔄 Refresh</button>
      <button class="btn-clear" id="clearBtn">🗑️ Clear</button>
      <button class="btn-back" id="backBtn">← Back</button>
    </div>
  </div>

  <div class="logs-container" id="logsContainer">
    <div class="empty-state">Loading...</div>
  </div>

  <script src="logs.js"></script>
</body>
</html>
