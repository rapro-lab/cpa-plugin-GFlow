[global]
# Do not commit real secrets here. When these are empty (or still at a legacy
# shared default) the plugin generates random values on first boot and writes
# them once to <data_dir>/admin-credentials.txt, next to flow.db.
api_key = ""
admin_username = "admin"
admin_password = ""

[flow]
labs_base_url = "https://flow.google.com"
api_base_url = "https://flow.google.com"
timeout = 120
max_retries = 3
# Verify TLS certificates for Flow and media downloads. Disable only behind a
# TLS-inspecting proxy; prefer pointing tls_ca_bundle at its root certificate.
tls_verify = true
tls_ca_bundle = ""
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500

[call_logic]
call_mode = "default"  # default=random rotation strategy, polling=sequential rotation strategy

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # cache TTL in seconds, 2 hours by default; 0 means entries are never expired automatically
base_url = ""   # base URL for cached files; leave empty to use the server address

[captcha]
captcha_method = "yescaptcha"  # captcha method: yescaptcha/captcharun/twocaptcha/capsolver/ezcaptcha/browser/personal/remote_browser
browser_recaptcha_settle_seconds = 3.0  # extra settle wait for the custom-site score test after reload/clr is ready
browser_flow_page_warmup_seconds = 6.0  # settle wait after browser harvest opens the Flow page
browser_count = 1  # number of headful browser instances in browser mode
browser_captcha_max_retries = 5  # maximum retries per captcha fetch in browser mode
browser_captcha_generation_retries = 6  # total retries for generation requests when reCAPTCHA evaluation fails
personal_solve_strategy = "auto"  # auto=prefer trusted JS and fall back to native harvest on failure; direct/harvest force one path
personal_project_pool_size = 4  # number of projects kept per token in personal mode (affects project rotation only, not the number of captcha tabs)
personal_max_resident_tabs = 5  # maximum shared captcha tabs in personal mode; all tokens/projects share this tab set
browser_personal_fresh_restart_every_n_solves = 10  # restart the browser with a clean profile after this many successful captchas in personal mode; 0 disables it
personal_idle_tab_ttl_seconds = 600  # idle reclaim timeout for personal-mode tabs (seconds)
yescaptcha_api_key = ""  # YesCaptcha API key
yescaptcha_base_url = "https://api.yescaptcha.com"
yescaptcha_task_type = "RecaptchaV3TaskProxylessM1S9"  # options: RecaptchaV3TaskProxyless/RecaptchaV3TaskProxylessM1/RecaptchaV3TaskProxylessM1S7/RecaptchaV3TaskProxylessM1S9
remote_browser_base_url = ""  # remote headful captcha service URL
remote_browser_api_key = ""   # remote headful captcha service API key
remote_browser_timeout = 60   # remote headful captcha request timeout (seconds)
capsolver_api_key = ""
capsolver_base_url = "https://api.capsolver.com"
captcharun_api_key = ""
captcharun_base_url = "https://api.captcha-run.com"

twocaptcha_api_key = ""
twocaptcha_base_url = "https://api.2captcha.com"
